<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Dash</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['monospace']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        html.dark .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.6);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .btn-tap-effect {
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        .btn-tap-effect:active {
            transform: scale(0.96);
        }

        .btn-select {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(241, 245, 249, 0.9);
            color: #475569;
            border: 1.5px solid #cbd5e1;
            padding: 0.35rem 0.2rem;
            font-size: 0.75rem;
        }

        html.dark .btn-select {
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            border: 1.5px solid #334155;
        }

        .btn-select.active {
            background: #6366f1 !important;
            color: #ffffff !important;
            border-color: #4f46e5 !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .digit-hero {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: 0.1rem;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html.dark .digit-hero {
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
        }

        .fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="number"] {
            font-size: 24px !important;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #10b981;
            padding: 0.75rem 1.5rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 700;
            opacity: 0;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 100;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .circle-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #cbd5e1;
            color: #475569;
            transition: all 0.2s ease;
        }

        html.dark .circle-icon-btn {
            background-color: #334155;
            color: #cbd5e1;
        }

        .circle-icon-btn:hover {
            transform: scale(1.05);
            background-color: #94a3b8;
            color: #0f172a;
        }

        html.dark .circle-icon-btn:hover {
            background-color: #475569;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center justify-start py-1 px-2 gap-0 overflow-x-hidden max-w-[402px] max-h-[820px] mx-auto">

    <script>
        // Game State Variables
        let seqLength = 7;
        let exposureTime = 8;
        let currentRound = 1;
        const maxRounds = 6;
        let correctCount = 0;
        let wrongCount = 0;
        let currentSequence = "";
        let sessionLogs = [];
        let timerInterval = null;
        let soundEnabled = true;

        // Audio Context initialization for sound effects
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'tick') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(164.81, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        // Font scaling depending on sequence length
        function updateHeroFontSize() {
            const heroEl = document.getElementById('digit-display');
            if (seqLength === 7) heroEl.style.fontSize = '3.8rem';
            else if (seqLength === 8) heroEl.style.fontSize = '3.4rem';
            else if (seqLength === 9) heroEl.style.fontSize = '3.0rem';
            else if (seqLength === 10) heroEl.style.fontSize = '2.7rem';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            document.getElementById('theme-sun').classList.toggle('hidden', !isDark);
            document.getElementById('theme-moon').classList.toggle('hidden', isDark);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-icon-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('sound-icon-off').classList.toggle('hidden', soundEnabled);
        }

        function setLength(val) {
            seqLength = val;
            document.querySelectorAll('[id^="len-"]').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`len-${val}`).classList.add('active');
            document.getElementById('length-badge').textContent = `${val} Digits`;
            updateHeroFontSize();
            updateSampleSequence();
        }

        function setExposure(val) {
            exposureTime = val;
            document.querySelectorAll('[id^="exp-"]').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`exp-${val}`).classList.add('active');
            document.getElementById('exposure-badge').textContent = `${val}.0s`;
        }

        function updateSampleSequence() {
            let sample = "";
            for (let i = 0; i < seqLength; i++) {
                sample += Math.floor(Math.random() * 10);
            }
            document.getElementById('digit-display').textContent = sample;
        }

        function generateSequence() {
            let seq = "";
            for (let i = 0; i < seqLength; i++) {
                seq += Math.floor(Math.random() * 10);
            }
            return seq;
        }

        function startChallenge() {
            getAudioContext();
            document.getElementById('config-bar').classList.add('hidden');
            document.getElementById('start-btn-container').classList.add('hidden');
            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('feedback-container').classList.add('hidden');

            runExposurePhase();
        }

        function runExposurePhase() {
            currentSequence = generateSequence();
            document.getElementById('digit-display').textContent = currentSequence;
            updateHeroFontSize();

            const timerCircle = document.getElementById('timer-progress');
            const totalDash = 276.46;
            timerCircle.style.strokeDashoffset = '0';

            const startTime = Date.now();
            const durationMs = exposureTime * 1000;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, durationMs - elapsed);
                const fraction = remaining / durationMs;
                
                timerCircle.style.strokeDashoffset = (totalDash * (1 - fraction)).toString();

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    startRecallPhase();
                }
            }, 30);
        }

        function startRecallPhase() {
            playSound('tick');
            document.getElementById('digit-display').textContent = "•••••••";
            document.getElementById('input-container').classList.remove('hidden');
            document.getElementById('input-container').classList.add('flex');
            
            const userInput = document.getElementById('user-input');
            userInput.value = "";
            userInput.placeholder = "•".repeat(seqLength);
            userInput.focus();
        }

        function submitAnswer() {
            const userInput = document.getElementById('user-input').value.trim();
            const isCorrect = (userInput === currentSequence);

            if (isCorrect) {
                correctCount++;
                playSound('correct');
            } else {
                wrongCount++;
                playSound('wrong');
            }

            document.getElementById('score-correct').textContent = correctCount;
            document.getElementById('score-wrong').textContent = wrongCount;

            sessionLogs.push({
                round: currentRound,
                target: currentSequence,
                user: userInput || "(empty)",
                correct: isCorrect
            });

            // Display feedback
            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('input-container').classList.remove('flex');
            
            const badge = document.getElementById('feedback-badge');
            if (isCorrect) {
                badge.textContent = "CORRECT RECALL!";
                badge.className = "px-4 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30";
            } else {
                badge.textContent = "INCORRECT!";
                badge.className = "px-4 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30";
            }

            document.getElementById('target-seq').textContent = currentSequence;
            document.getElementById('your-seq').textContent = userInput || "None";
            document.getElementById('feedback-container').classList.remove('hidden');
            document.getElementById('feedback-container').classList.add('flex');
        }

        function nextRound() {
            if (currentRound >= maxRounds) {
                showSummary();
            } else {
                currentRound++;
                document.getElementById('round-indicator').textContent = `ROUND: ${currentRound} / ${maxRounds}`;
                document.getElementById('feedback-container').classList.add('hidden');
                document.getElementById('feedback-container').classList.remove('flex');
                runExposurePhase();
            }
        }

        function showSummary() {
            document.getElementById('game-workspace').classList.add('hidden');
            document.getElementById('summary-view').classList.remove('hidden');
            document.getElementById('summary-view').classList.add('flex');

            const totalDigits = correctCount * seqLength;
            const accuracy = Math.round((correctCount / maxRounds) * 100);

            document.getElementById('summary-accuracy').textContent = `${accuracy}%`;
            document.getElementById('summary-digits').textContent = totalDigits;

            const logsContainer = document.getElementById('session-logs');
            logsContainer.innerHTML = "";
            sessionLogs.forEach(log => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center py-1 border-b border-slate-200 dark:border-slate-700/50 last:border-0";
                item.innerHTML = `
                    <span class="font-bold">Round ${log.round}:</span>
                    <span class="font-mono ${log.correct ? 'text-emerald-500' : 'text-rose-500'}">${log.user} / ${log.target}</span>
                    <span>${log.correct ? '✅' : '❌'}</span>
                `;
                logsContainer.appendChild(item);
            });
        }

        function resetToHome() {
            if (timerInterval) clearInterval(timerInterval);
            currentRound = 1;
            correctCount = 0;
            wrongCount = 0;
            sessionLogs = [];

            document.getElementById('round-indicator').textContent = `ROUND: 1 / ${maxRounds}`;
            document.getElementById('score-correct').textContent = "0";
            document.getElementById('score-wrong').textContent = "0";

            document.getElementById('summary-view').classList.add('hidden');
            document.getElementById('summary-view').classList.remove('flex');
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('input-container').classList.add('hidden');
            
            document.getElementById('game-workspace').classList.remove('hidden');
            document.getElementById('game-workspace').classList.add('flex');
            document.getElementById('config-bar').classList.remove('hidden');
            document.getElementById('start-btn-container').classList.remove('hidden');

            document.getElementById('timer-progress').style.strokeDashoffset = '0';
            updateSampleSequence();
        }

        function shareResults() {
            const accuracy = Math.round((correctCount / maxRounds) * 100);
            const text = `🧠 Digit Dash Pro Diagnostic\nLength: ${seqLength} digits | Window: ${exposureTime}s\nAccuracy: ${accuracy}% (${correctCount}/${maxRounds})\nDigits Memorized: ${correctCount * seqLength}`;
            
            try {
                const tempInput = document.createElement("textarea");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);

                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            } catch (err) {
                console.log('Copy failed', err);
            }
        }

        // Handle Enter key on number input
        document.getElementById('user-input').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        });

        // Initialize on load
        window.onload = function() {
            updateSampleSequence();
        }
    </script>
</body>
</html>
